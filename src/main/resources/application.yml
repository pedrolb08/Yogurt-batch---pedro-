spring:
  application:
    name: demo
  datasource:
    url: jdbc:h2:mem:yogurtdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always

server:
  port: 8082

logging:
  level:
    com.yougurtmaker: DEBUG
    org.hibernate.sql: DEBUG
    org.hibernate.type.descriptor.sql.basicBinder: TRACE

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
